<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Temperature Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h2>🌡️ Temperature Monitor</h2>
        </div>
        <div class="nav-menu">
            <a href="{{ url_for('main.index') }}" class="nav-link">Home</a>
            <a href="{{ url_for('main.dashboard') }}" class="nav-link">Dashboard</a>
            <a href="{{ url_for('main.monitoring') }}" class="nav-link">Monitoring</a>
            <a href="{{ url_for('main.test_ml') }}" class="nav-link">Test ML</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
